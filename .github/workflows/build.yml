name: build

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces its stale run; every other run keeps its result.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Xcode 26+ ships it separately, and MLX's kernels cannot build without it.
      - name: Install the Metal Toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Swift version
        run: swift --version

      # Runs for real here: the runner has full Xcode. Local CLT-only setups
      # cannot execute tests (no xctest host) — see `make test`.
      - name: Run tests
        run: swift test

      - name: Build (release, arm64)
        run: swift build -c release

      - name: Assemble app bundle
        run: make bundle

      # No stable signing identity on CI, so sign ad-hoc explicitly.
      - name: Sign (ad-hoc)
        run: make sign IDENTITY=-

      # Fails if the bundle is not self-contained (Cmlx.framework, rpath,
      # library validation) or if dyld cannot launch it.
      - name: Verify bundle
        run: make verify-bundle

      - name: Inspect binary architectures
        run: lipo -info build/MoDict.app/Contents/MacOS/MoDict

      - name: Upload app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MoDict.app
          path: build/MoDict.app
